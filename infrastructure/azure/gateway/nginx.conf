server {
    listen 8080;
    client_max_body_size 5m;
    auth_basic "StockWise";
    auth_basic_user_file /run/stockwise.htpasswd;
    location = /health { auth_basic off; return 200 'ok'; }
    location /market-api/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
    }
    location /assistant-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location /mlflow { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; }
    location /api/ { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; }
    location /ajax-api/ { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; }
    location /get-artifact { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; }
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
