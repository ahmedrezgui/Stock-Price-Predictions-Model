name: Forecast candidate training
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      data_revision:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: forecast-training-${{ github.ref }}
  cancel-in-progress: false
jobs:
  train-model:
    environment: azure-approved
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ML_WORKSPACE: ${{ vars.AZURE_ML_WORKSPACE }}
      AZURE_STORAGE_ACCOUNT_URL: ${{ vars.AZURE_STORAGE_ACCOUNT_URL }}
      FORECAST_REGISTRY_CONTAINER: forecast-registry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.data_revision || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install '.[dev,azure]' 'dvc[azure]'
      - name: Core correctness before training
        run: pytest tests/forecasting tests/scripts/test_train_model.py -q
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Pull exact checked-out data revision
        run: dvc pull
      - uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/models
            reports/training
          key: forecast-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: forecast-state-${{ github.ref_name }}-
      - name: Train and evaluate on GitHub CPU runner
        env:
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI || 'sqlite:///mlflow.db' }}
          MLFLOW_TRACKING_TOKEN: ${{ secrets.MLFLOW_TRACKING_TOKEN }}
          MLFLOW_EXPERIMENT_NAME: stock-return-forecasting
        run: python -m scripts.train_model --config configs/training.json --device cpu
      - uses: actions/cache/save@v4
        with:
          path: |
            artifacts/models
            reports/training
          key: forecast-state-${{ github.ref_name }}-${{ github.run_id }}
      - name: Retain candidate bundles and evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-training-${{ github.run_id }}
          path: |
            artifacts/models
            reports/training
            data/raw
            mlflow.db
            mlruns
          retention-days: 30
