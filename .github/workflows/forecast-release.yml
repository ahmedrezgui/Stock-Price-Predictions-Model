name: Release gated forecasting service
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Stock with a frozen configs/release_policies/SYMBOL.json policy
        required: true
        default: BIAT
        type: string
      candidate_version:
        description: Exact Azure ML registered model version
        required: true
        type: string
      bootstrap:
        description: First production deployment; fresh evidence is still required
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
concurrency:
  group: forecast-release
  cancel-in-progress: false
jobs:
  release:
    environment: azure-approved
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ML_WORKSPACE: ${{ vars.AZURE_ML_WORKSPACE }}
      AZURE_STORAGE_ACCOUNT_URL: ${{ vars.AZURE_STORAGE_ACCOUNT_URL }}
      FORECAST_REGISTRY_CONTAINER: forecast-registry
      FORECAST_DATA_CONTAINER: forecast-serving
      FORECAST_API_KEY: ${{ secrets.FORECAST_API_KEY }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      APP_NAME: ${{ vars.FORECAST_PRODUCTION_APP_NAME }}
      SYMBOL: ${{ inputs.symbol }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install '.[azure]'
      - name: Evaluate exact candidate on current serving snapshot
        id: gate
        run: |
          python - <<'PY'
          import json, os, re
          from stock_forecasting.azure_registry import registry_client
          from stock_forecasting.cloud_storage import refresh_data
          from stock_forecasting.release_gate import run_gate
          symbol = os.environ['SYMBOL']
          if not re.fullmatch(r'[A-Z0-9_-]+', symbol):
              raise ValueError('Invalid symbol')
          if not os.environ['MLFLOW_TRACKING_URI'].startswith('azureml://'):
              raise ValueError('Azure ML tracking is required')
          os.environ['FORECAST_DATA_BACKEND'] = 'azure'
          refresh_data('release-input', symbol)
          result = run_gate(registry_client(os.environ['MLFLOW_TRACKING_URI']),
                            f'stock-{symbol}-return-h1', os.environ['CANDIDATE_VERSION'],
                            f'release-input/{symbol}.csv', f'configs/release_policies/{symbol}.json',
                            bootstrap=os.environ['BOOTSTRAP'] == 'true')
          print(json.dumps(result, indent=2))
          if result['decision'] != 'passed':
              raise SystemExit(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('run_id=' + result['gate_run_id'] + '\n')
          PY
      - name: Package only evaluated weights and data
        env:
          GATE_RUN_ID: ${{ steps.gate.outputs.run_id }}
        run: python -m stock_forecasting.release --mlflow-uri "$MLFLOW_TRACKING_URI" --gate-run-id "$GATE_RUN_ID" --policy "configs/release_policies/$SYMBOL.json" --data release-input --output deployment --retain configs/initial_release.json
      - name: Build and publish private image
        run: |
          az acr login --name "$ACR_NAME"
          docker build --target packaged -t "$ACR_NAME.azurecr.io/stock-forecast:$IMAGE_TAG" .
          docker push "$ACR_NAME.azurecr.io/stock-forecast:$IMAGE_TAG"
      - name: Recheck before updating production app
        env:
          GATE_RUN_ID: ${{ steps.gate.outputs.run_id }}
        run: |
          python - <<'PY'
          import os
          from stock_forecasting.azure_registry import registry_client
          from stock_forecasting.release_gate import verify_gate
          from stock_forecasting.portfolio import verify_retained
          symbol = os.environ['SYMBOL']
          verify_gate(registry_client(os.environ['MLFLOW_TRACKING_URI']), os.environ['GATE_RUN_ID'],
                      f'configs/release_policies/{symbol}.json', f'release-input/{symbol}.csv')
          verify_retained(registry_client(os.environ['MLFLOW_TRACKING_URI']), 'deployment')
          PY
          test -n "$APP_NAME"
          case "$APP_NAME" in *preview*) echo 'Production cannot target preview'; exit 1 ;; esac
          az containerapp update --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --image "$ACR_NAME.azurecr.io/stock-forecast:$IMAGE_TAG" --output none
      - name: Verify live model before recording production deployment
        env:
          GATE_RUN_ID: ${{ steps.gate.outputs.run_id }}
        run: |
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in $(seq 1 20); do
            if python -m stock_forecasting.deployment --mlflow-uri "$MLFLOW_TRACKING_URI" --gate-run-id "$GATE_RUN_ID" --policy "configs/release_policies/$SYMBOL.json" --portfolio deployment --endpoint "https://$fqdn"; then exit 0; fi
            sleep 10
          done
          exit 1
