name: Forecast correctness (no cloud)
on:
  push:
    paths: ['stock_forecasting/**', 'src/prediction_model/**', 'scripts/train_model.py', 'notebook/**', 'tests/forecasting/**', 'pyproject.toml', 'configs/release_policy.json', '.github/workflows/forecast-release.yml', '.github/workflows/forecast-ci.yml']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install '.[dev,tracking]' azure-storage-blob azure-identity azure-ai-ml
      - run: ruff check stock_forecasting tests/forecasting infrastructure/azure/score.py
      - run: ruff format --check stock_forecasting tests/forecasting infrastructure/azure/score.py
      - run: pytest tests/forecasting tests/scripts/test_train_model.py --cov=stock_forecasting --cov-report=term-missing
